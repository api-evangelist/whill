name: Whill
description: >-
  WHILL, Inc. designs and manufactures enhanced personal mobility solutions —
  electric power chairs and mobility scooters, including the Model C2, Model F,
  the Modo Breeze ultralight foldable wheelchair, and the Model R three- and
  four-wheel scooters — and operates an autonomous personal mobility service
  that has completed over 700,000 rides worldwide across airports and other
  venues. WHILL was surfaced as a portfolio company of 500 Global and added to
  the API Evangelist network. As of this writing it is a consumer hardware and
  mobility-service company and publishes no public developer API, SDK, or
  developer portal; this profile is maintained as a company record and will be
  enriched if WHILL launches a developer program.
